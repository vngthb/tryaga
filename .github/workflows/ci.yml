name: CI

on: [push, pull_request]

permissions:
  contents: read

jobs:
  check:
    name: OTP ${{ matrix.otp }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        otp: ['27', '28', '29']
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: erlef/setup-beam@v1
        with:
          otp-version: ${{ matrix.otp }}
          rebar3-version: '3.27.0'
      - name: Compile
        run: rebar3 compile
      - name: Test
        run: rebar3 eunit
      - name: Elvis
        run: rebar3 lint
      - name: Dialyzer
        run: rebar3 dialyzer
